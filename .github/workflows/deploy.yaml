name: Deployment

on:
  push:
    branches:
      - master  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }} 

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and tag Docker image
      run: |
        IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest"
        
        # Build Docker image
        docker build -t $IMAGE_URI .

    - name: Push Docker image to ECR
      run: |
        # Push image to ECR
        
        IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest"
        docker push $IMAGE_URI
   
    - name: SSH into EC2 and run Docker container
      run: |
        mkdir -p .ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > .ssh/id_rsa
        chmod 400 .ssh/id_rsa
        ssh -o StrictHostKeyChecking=no -i .ssh/id_rsa ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest"
          docker rm -f upflairs-frontend
          docker rmi $IMAGE_URI 
          docker run -d --name upflairs-frontend -p 1123:80 $IMAGE_URI
        EOF
    - name: Delete untagged images from ECR
      run: |
        # Get untagged images and delete them
        echo "Deleting untagged images from ECR..."
        UNTAGGED_IMAGES=$(aws ecr list-images --repository-name ${{ secrets.ECR_REPOSITORY }} --filter tagStatus=UNTAGGED --query 'imageIds[*]' --output json)

        if [ "$UNTAGGED_IMAGES" != "[]" ]; then
          echo "Found untagged images: $UNTAGGED_IMAGES"
          aws ecr batch-delete-image --repository-name ${{ secrets.ECR_REPOSITORY }} --image-ids "$UNTAGGED_IMAGES"
        else
          echo "No untagged images found."
        fi
